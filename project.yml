name: FreeNotes
options:
  bundleIdPrefix: com.ethan       # change "yourname"
targets:
  FreeNotes:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources: [FreeNotes]              # folder containing the six .swift files
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ethan.FreeNotes   # change "yourname"
        PRODUCT_NAME: FreeNotes
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
                ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
